<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driving Berlin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='4' y='3.5' width='8' height='5' rx='2' fill='%23c0392b'/%3E%3Crect x='1' y='6' width='14' height='5.5' rx='2' fill='%23c0392b'/%3E%3Ccircle cx='4.5' cy='12' r='2' fill='%23222'/%3E%3Ccircle cx='11.5' cy='12' r='2' fill='%23222'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb4c8;
               user-select: none; -webkit-user-select: none; }
  #c { display: block; width: 100%; height: 100%; }
  /* load-error box, bottom centre (fail() only; speed is on the round map HUD, js/minimap.js) */
  #speed { font-family: sans-serif; position: absolute; color: #0F0; bottom: 25px; left: 40%;
           text-align: center; white-space: pre; margin: 0 auto; padding: 10px;
           background-color: rgba(0, 0, 0, 0.75); z-index: 1000; }
  #speed:empty { display: none; }   /* no dark square while there is nothing to show */
  /* camera sliders, in the same look as .button */
  #camui { position: absolute; right: 12px; top: 12px; padding: 8px 10px; font-size: 80%;
           font-family: sans-serif; color: #ddd; background-color: rgba(0, 0, 0, 0.75);
           border: 1px solid #666; border-radius: 5px; display: grid;
           grid-template-columns: auto 140px 48px; gap: 4px 8px; align-items: center; }
  #camui output { text-align: right; font-variant-numeric: tabular-nums; }
  /* dark translucent menu buttons */
  .button { cursor: pointer; position: absolute; width: 80px; height: 28px; text-align: center;
            line-height: 28px; font-size: 80%; font-family: sans-serif;
            background-color: rgba(0, 0, 0, 0.75); border: 1px solid #666; border-radius: 5px; color: #ddd; }
  .button:hover { background-color: #333; }
  #credit { position: absolute; left: 6px; bottom: 4px; font: 10px sans-serif;
            color: rgba(255, 255, 255, .8); text-shadow: 0 0 2px #000; }
  /* the old top menu row: hidden state holders since the Esc menu (js/menu.js, 2026-11-21); the
     selects / buttons keep their ids for code and console habits, the settings page drives the
     same functions. #camui (camera sliders) is moved into the settings page while it is open.
     --toprow (bottom edge of the row) stays as a variable for js/touch.js and js/areasign.js. */
  :root { --toprow: 0px; }
  #toprow { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toprow">
<div id="camui">
  <label for="camH">Höhe</label><input id="camH" type="range" min="10" max="600" step="5"><output id="camHv"></output>
  <label for="camD">Abstand</label><input id="camD" type="range" min="5" max="600" step="5"><output id="camDv"></output>
</div>
<div class="button" id="restart" style="left:12px; top:12px;">Restart</div>
<select class="button" id="moodSel" style="left:100px; top:12px; width:110px; height:30px;" title="mood (M = next)"></select>
<div class="button" id="collide" style="left:218px; top:12px; width:110px;" title="street obstacles and tree trunks (C); buildings always block">Obstacles: off</div>
<select class="button" id="speedSel" style="left:336px; top:12px; width:110px; height:30px;" title="top speed (panorama drive), forwards and backwards"></select>
<div class="button" id="eggs" style="left:778px; top:12px; width:auto; min-width:56px; padding:0 8px; box-sizing:border-box; display:none;"></div>
</div>
<div id="speed"></div>
<div class="button" id="sbahnOff" style="display:none; left:40%; bottom:84px; width:auto; padding:0 12px; z-index:1000; white-space:nowrap;" title="Rettungsbär: runter von den Gleisen auf die Straße (G)">🐻 Runter von den Gleisen <b>G</b></div>
<div id="credit"></div>

<script src="Box2D.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
// Keys (Esc = menu js/menu.js, the game pauses; H = menu on "Steuerung"): arrows drive (hold down at standstill = reverse),
// V head-up / north-up, B car / bus, R restart, M next mood, F show LoD2 walls + tree trunks + mesh obstacles,
// C street obstacles + tree trunks collide on/off (starts off on every load; buildings always block),
// U turn around (anywhere, e.g. at the glass wall on the map edge; js/edge.js).
// Quiet game (README Rules): no on-screen messages while driving (loading screen, menu and map may carry text).
// Water (OSM): driving in sinks the car, respawn on the road 2 s earlier. Pits (level.pit): the car falls in, same rescue.
// URL: ?height= ?distance= ?power= ?carscale= ?handling=arcade|classic ?mood=day|moon|snow ?skycam=1 (Horizont view, not saved) ?maxspeed=50 (0 = free)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Vehicle, mapClamped, wrapAngle, SOLID } from './js/vehicle.js';
import { createMood } from './js/mood.js';
import { createSky } from './js/sky.js';   // photographed sky: dome, car light (no mood and the day mood)
import { createCamCollider } from './js/camcollide.js';
import { createCarGround } from './js/ground.js';
import { createEdge } from './js/edge.js';
import { createBalloon } from './js/balloon.js';   // easter egg: Weltballon (Zimmerstr./Wilhelmstr.), E = ride
import { createNoDrive } from './js/nodrive.js';
import { createRespectLine, MEMORIAL } from './js/respect.js';   // "Respect is Everything." on entering the Holocaust memorial (owner's exception to the quiet rule)
import { loadSbahn, makeRoute, createSbahn } from './js/sbahn.js';   // easter egg: Stadtbahn viaduct (secret door at Jannowitzbruecke)
import { loadTunnels, createTunnels } from './js/tunnels.js';   // drivable road tunnels (Tiergarten, Alexanderplatz)
import { createBridges } from './js/bridges.js';   // bridges over water: drivable decks (Gustav-Heinemann-Bruecke ...)
import { loadRoofs, createRoofs } from './js/roofs.js';   // easter egg: roof mode (Bundestag roof + Spree skywalk), bear lift on Paul-Loebe-Allee
import { createLoading } from './js/loading.js';   // loading screen: the way into the game (blurred view sharpens with the progress)
import { createMenu } from './js/menu.js';   // Esc menu (pause, settings, controls, bears, map); touch: round button top right
import { createTouch, isCoarse, isBlocked as rotateBlocked } from './js/touch.js';
import { createGamepad } from './js/gamepad.js';   // game controllers: left stick, triggers, buttons (polled in frame())   // touch sticks on phones / tablets, feed the same key events
import { site, fetchBin } from './js/site.js';   // optional site.json (published copy): tile URL, gzipped .bin files

const params = new URLSearchParams(location.search);
// one level: the streamed Mitte (small level `mitte` retired 2026-11-19); ?level= from old
// bookmarks is ignored, and so is a mood-resume / teleport stamped with another level name
const LEVEL = 'mitte_all';
const $ = (id) => document.getElementById(id);
const speedEl = $('speed');
// loading screen (js/loading.js): up from here until the first view is in; also the old
// berlinDrive.intro object (open, hide(), show() harmless)
const loading = createLoading({ base: `levels/${LEVEL}/`, canvas: $('c') });
const fail = (e) => { console.error(e); speedEl.style.color = '#f66'; speedEl.textContent = String(e.message || e); loading.fail(e); };
// ---------- pause (Esc menu, overview map) and the loading hold ----------
// reasons: 'menu', 'map' = frozen picture (nothing rendered, no physics, no sequence clocks);
// 'load' = the loading screen: frames render (the blurred view), physics and sequences wait.
// 'rotate' = phone held upright (js/touch.js blocker): frozen like the menu, but during the
// loading screen it lets 'load' run on, so tiles keep loading under the blocker.
// On release the frame clock restarts, so no large dt; held keys are dropped both ways.
const pauseBy = new Set(['load']);
let pausedRedraw = false;   // resize while frozen: draw the frozen picture once more
const isFrozen = () => pauseBy.has('menu') || pauseBy.has('map') || (pauseBy.has('rotate') && !pauseBy.has('load'));

// ---------- three.js ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isCoarse() ? 1 : 1.5));   // phones / tablets: 1 (fill rate, memory)
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c8);
scene.fog = new THREE.Fog(0x9fb4c8, 1200, 4000);
const camera = new THREE.PerspectiveCamera(35, 1, 1, 8000);
let mood = null;   // ?mood=: sky, grade, fog, bloom (js/mood.js); null = plain daylight render
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  mood?.setSize(innerWidth, innerHeight);
  pausedRedraw = true;
}
addEventListener('resize', resize); resize();

// ---------- level ----------
const base = `levels/${LEVEL}/`;
loading.step('Lade den Stadtplan …', 0);
const level = await fetch(base + 'level.json').then((r) => {
  if (!r.ok) throw new Error(`levels/${LEVEL}/level.json: HTTP ${r.status} - run build_stream.py`);
  return r.json();
}).catch((e) => { fail(e); throw e; });
$('credit').textContent = level.attribution;
loading.step('Lade das Höhenmodell …', 0.1);
// minimap HUD bottom left (js/minimap.js, levels/<name>/map.json from build_map.py); N = overview.
// Loaded on the side: a failure there never stops the game.
let minimap = null, mmMarkers = null;   // markers set before the module is in are handed over
const minimapStub = { pending: true, setMarkers(l) { mmMarkers = l; } };
import('./js/minimap.js').then((m) => { minimap = m.createMinimap({ level, base, isWater, onOverview }); if (mmMarkers) minimap.setMarkers(mmMarkers); })
  .catch((e) => console.warn('minimap off:', e));
const H = level.height;
const heights = new Float32Array(await fetchBin(base + H.file).then((r) => r.arrayBuffer()));
const WT = level.water;
loading.step('Lade Wasser, S-Bahn, Tunnel und Brücken …', 0.25);
const water = WT ? new Uint8Array(await fetchBin(base + WT.file).then((r) => r.arrayBuffer())) : null;
// Stadtbahn viaduct (js/sbahn.js, levels/<name>/sbahn.json; null elsewhere): rails mode = the car on the deck
const sbahnData = await loadSbahn(base), sbahnRoute = sbahnData ? makeRoute(sbahnData) : null;
let sbahn = null;   // createSbahn() below (needs world, edge)
// road tunnels (js/tunnels.js, levels/<name>/tunnels.json from build_tunnels.py): tunnel mode = the car under the ground
const tunnelData = await loadTunnels(base);
let tunnels = null;   // createTunnels() below (needs world, edge)
// roof decks (js/roofs.js, levels/<name>/roofs_deck.* from build_roofs.py): roof mode = the car on a roof
const roofData = await loadRoofs(base);
let roofs = null;   // createRoofs() below (needs world, edge)
// bridges over water (js/bridges.js, levels/<name>/bridges.json from build_bridges.py; null elsewhere):
// deck outlines are never water, the deck profile is the car's road there (at deck level), rails at the drops
const bridges = await createBridges({ base, world: () => world }).catch((e) => { console.warn('bridges off:', e); return null; });
// OSM water minus bridges (build_level.py); (x, z) in three/Box2D coords. y (the car's road layer):
// on a bridge deck only at deck level (fell off / under it: still water); without y: any deck is dry
function isWater(x, z, y) {
  if (!water) return false;
  if (bridges && (y === undefined ? bridges.inDeck(x, z) : bridges.ground(x, z, y) !== null)) return false;
  const i = Math.floor((x - WT.x0) / WT.cell), j = Math.floor((-z - WT.n0) / WT.cell);
  return i >= 0 && j >= 0 && i < WT.nx && j < WT.nz && water[j * WT.nx + i] === 1;
}
// pits (build_level.py pit_layer: construction pit etc., the mesh lies >= 2 m under the
// street): small level = one grid like the water mask + the pit-floor height; streamed level
// (build_pits.py) = PT.windows, small grids per pit concatenated in the same two files
// (element offsets off / floor.off); absent on other levels. Off in S-Bahn rails mode (viaduct).
const PT = level.pit;
loading.step('Lade Baugruben …', 0.4);
const [pit, pitFloor] = PT ? await Promise.all([PT.file, PT.floor.file].map((f) => fetchBin(base + f).then((r) => r.arrayBuffer())))
  .then(([a, b]) => [new Uint8Array(a), new Float32Array(b)]) : [null, null];
const pitWins = !PT ? [] : (PT.windows || [{ ...PT, off: 0, floor: { ...PT.floor, off: 0 } }]).map((w) => ({ cell: 1, ...w }));
function pitWin(x, z) {   // several pits: the window that holds (x, z), else one within 3 cells (rim floor lookup)
  let near = null;
  for (const w of pitWins) {
    const i = Math.floor((x - w.x0) / w.cell), j = Math.floor((-z - w.n0) / w.cell);
    if (i >= 0 && j >= 0 && i < w.nx && j < w.nz) return [w, i, j];
    if (!near && i >= -3 && j >= -3 && i < w.nx + 3 && j < w.nz + 3) near = [w, i, j];
  }
  return near;
}
function isPit(x, z) {
  if (!pit || sbahn?.active || tunnels?.active || roofs?.active) return false;
  const q = pitWin(x, z);
  if (!q) return false;
  const [w, i, j] = q;
  return i >= 0 && j >= 0 && i < w.nx && j < w.nz && pit[w.off + j * w.nx + i] === 1;
}
// mesh floor of the pit at (x, z); near the rim the nearest floor cell within 3 m; null off pits
function pitFloorAt(x, z) {
  const q = pit && pitWin(x, z);
  if (!q) return null;
  const [w, wi, wj] = q, F = w.floor, ci = wi - F.i0, cj = wj - F.j0;
  let best = null, bd = Infinity;
  for (let dj = -3; dj <= 3; dj++) for (let di = -3; di <= 3; di++) {
    const i = ci + di, j = cj + dj, d = di * di + dj * dj;
    if (i < 0 || j < 0 || i >= F.nx || j >= F.nz || d >= bd) continue;
    const v = pitFloor[F.off + j * F.nx + i];
    if (Number.isFinite(v)) { best = v; bd = d; }
  }
  return best;
}
const clampTo = (v, max) => (v < 0 ? 0 : v > max ? max : v);
// frozen water (mood.frozen, e.g. snow): flat ice per connected water region (built
// after the mood below); iceLevelAt = ice height or null. Every ground lookup asks it
// first, so car, shadow, attitude and camera target ride on the flat ice.
let ice = null;   // { rowStart, runA, runB, runR, level }
function iceLevelAt(x, z) {
  if (!ice || !isWater(x, z)) return null;
  const i = Math.floor((x - WT.x0) / WT.cell), j = Math.floor((-z - WT.n0) / WT.cell);
  let lo = ice.rowStart[j], hi = ice.rowStart[j + 1] - 1;   // last run of row j starting at <= i
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ice.runA[m] <= i) lo = m; else hi = m - 1; }
  return ice.level[ice.runR[lo]];
}
function groundAt(x, z) { const y = iceLevelAt(x, z); return y !== null ? y : gridAt(x, z); }
// height model (LoD2 + mesh offset), bilinear; (x, z) in three/Box2D coords
function gridAt(x, z) {
  const fi = clampTo((x - H.x0) / H.cell, H.nx - 1), fj = clampTo((-z - H.n0) / H.cell, H.nz - 1);
  const i = Math.min(Math.floor(fi), H.nx - 2), j = Math.min(Math.floor(fj), H.nz - 2);
  const u = fi - i, v = fj - j, k = j * H.nx + i;
  return (heights[k] * (1 - u) + heights[k + 1] * u) * (1 - v) +
         (heights[k + H.nx] * (1 - u) + heights[k + H.nx + 1] * u) * v;
}
// the car on the real mesh road (js/ground.js): carY = its road height (wheel probes
// into the drawn mesh, groundAt as fallback); gOff = carY - groundAt at the car.
// groundNear = groundAt corrected by that offset, for ground lookups near the car
// (camera target, tyre-track check) - the height model can be metres off the mesh.
// S-Bahn rails mode: the deck profile replaces the street height model, no ice under the car
// tunnel mode: the roadway profile replaces the mesh under the car (no mesh down there)
const carGround = createCarGround({ scene, groundAt: (x, z) => (roofs?.active ? roofs.ground(x, z) : null) ?? (tunnels?.active ? tunnels.ground(x, z) : null) ?? (sbahn?.active ? sbahn.ground(x, z) : null) ?? groundAt(x, z),
                                    override: (x, z) => (roofs?.active ? roofs.heightAt(x, z) : tunnels?.active ? tunnels.heightAt(x, z) : sbahn?.active ? null : bridges?.ground(x, z, carY) ?? iceLevelAt(x, z)) });   // bridge deck (at deck level)
let carY = groundAt(level.spawn.x, level.spawn.z), gOff = 0;
const groundNear = (x, z) => groundAt(x, z) + gOff;
// the sun of the photographed city: the car's blob shadow falls SUN_OFFSET (x east, z = -north;
// metres per metre of car height) away from it, i.e. toward ENE (bearing ~59 deg), so the sun
// stands at bearing ~239 deg (WSW), ~43 deg up. A mood with its own sun overwrites the array (mood.js apply).
const SUN_OFFSET = [0.9, -0.55];   // metres per metre of car height, away from carSun (low sun: visible beside the car)
const SUN_BEARING = (THREE.MathUtils.radToDeg(Math.atan2(-SUN_OFFSET[0], SUN_OFFSET[1])) + 360) % 360;
// photographed sky (js/sky.js) for plain daylight: no mood or the day mood; moon / snow keep their drawn skies
let sky = createSky({ renderer, sunBearing: SUN_BEARING, fogColor: scene.fog.color, coarse: isCoarse() });
mood = createMood(params.get('mood') === 'night' ? 'moon' : params.get('mood'), { renderer, scene, camera, extent: level.extent, ground: groundAt(level.spawn.x, level.spawn.z), sky,
                                         groundAt: (x, z) => (tunnels?.active ? -1e4 : sbahnRoute?.deckIn(x, z) ?? groundNear(x, z)) });   // tunnel: no tyre tracks in the snow above   // snow: height model as a texture (S-Bahn deck: its own), tyre tracks
if (mood && !mood.photo) sky = null;   // moon / snow: the picture is never loaded
else { if (!mood) scene.add(sky.dome); sky.load(); }   // early: the car's light wants it in every view
if (mood?.frozen && water) {
  // water mask -> row runs -> regions (union-find over runs overlapping the row above);
  // ice level per region = median of the height grid over its cells (the grid follows
  // the photogrammetry water, whose lumps go +-2 m; the median sits on top of most)
  const nx = WT.nx, nz = WT.nz, rowStart = new Int32Array(nz + 1), A = [], B = [];
  for (let j = 0; j < nz; j++) {
    rowStart[j] = A.length;
    for (let i = 0, o = j * nx; i < nx;) {
      if (water[o + i] !== 1) { i++; continue; }
      const a = i; while (i < nx && water[o + i] === 1) i++;
      A.push(a); B.push(i);
    }
  }
  rowStart[nz] = A.length;
  const n = A.length, par = new Int32Array(n).map((_, k) => k);
  const find = (k) => { while (par[k] !== k) k = par[k] = par[par[k]]; return k; };
  for (let j = 1; j < nz; j++) {
    for (let p = rowStart[j - 1], q = rowStart[j]; p < rowStart[j] && q < rowStart[j + 1];) {
      if (A[p] < B[q] && A[q] < B[p]) { const rp = find(p), rq = find(q); if (rp !== rq) par[rp] = rq; }
      if (B[p] < B[q]) p++; else q++;
    }
  }
  const runR = new Int32Array(n), id = new Map(), samples = [];
  const step = Math.max(1, Math.round(H.cell / WT.cell));
  for (let j = 0; j < nz; j++) for (let k = rowStart[j]; k < rowStart[j + 1]; k++) {
    const r = find(k);
    if (!id.has(r)) { id.set(r, samples.length); samples.push([]); }
    const g = runR[k] = id.get(r), z = -(WT.n0 + (j + 0.5) * WT.cell);
    for (let i = A[k]; i < B[k]; i += step) samples[g].push(gridAt(WT.x0 + (i + 0.5) * WT.cell, z));
  }
  const level = new Float32Array(samples.map((v) => { v.sort((a, b) => a - b); return v[v.length >> 1]; }));
  ice = { rowStart, runA: Int32Array.from(A), runB: Int32Array.from(B), runR, level };
  // the sheet: one quad per run at its region's level (1 m steps along the banks)
  const pos = new Float32Array(n * 12), idx = new Uint32Array(n * 6);
  for (let j = 0; j < nz; j++) for (let k = rowStart[j]; k < rowStart[j + 1]; k++) {
    const x0 = WT.x0 + A[k] * WT.cell, x1 = WT.x0 + B[k] * WT.cell, y = level[runR[k]];
    const zN = -(WT.n0 + (j + 1) * WT.cell), zS = -(WT.n0 + j * WT.cell);
    pos.set([x0, y, zS, x1, y, zS, x1, y, zN, x0, y, zN], k * 12);
    idx.set([4 * k, 4 * k + 1, 4 * k + 2, 4 * k, 4 * k + 2, 4 * k + 3], k * 6);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setIndex(new THREE.BufferAttribute(idx, 1));
  ice.mesh = new THREE.Mesh(geo, mood.iceMaterial()); ice.mesh.name = 'ice'; scene.add(ice.mesh);
}

// photogrammetric mesh: lighting is baked into the textures, so render unlit (js/stream.js);
// meshLoaded = the spawn view is covered well enough to drive (set at the bottom, stream.ready())
let meshLoaded = !level.stream;
// streamed level (build_stream.py): 3D Tiles from disk around the camera (js/stream.js);
// on-screen "Detail" low / normal / high = GPU budget (MB) + screen-space error tau (px)
// + anisotropic filtering (2 / 4 / 8, new tiles), normal = the level's stream values; the
// base layer (all 49 L4 roots, ~105 MB with halved textures) stays loaded inside the budget; saved as localStorage 'berlinDrive.detail'.
// ?tilebudget= MB overrides the budget (not saved); stream.setBudget(mb) / setTau(px) at runtime
let stream = null;
let setDetail = null, detailNow = () => null, detailChoices = [];   // the Detail levels (streamed level only)
if (level.stream) {
  loading.step('Bereite die Stadt vor …', 0.5);
  const { createStreamer } = await import('./js/stream.js');
  const nb = level.stream.budgetMB || 1024, nt = level.stream.tau || 24;
  // phones / tablets (pointer: coarse) get a 'phone' entry (quarter budget) and start on it until a choice is saved
  const DETAIL = { ...(isCoarse() ? { phone: [Math.round(nb / 4), nt * 4 / 3, 2] } : {}),
                   low: [Math.round(nb / 2), nt * 4 / 3, 2], normal: [nb, nt, 4], high: [Math.round(nb * 1.5), nt * 0.75, 8] };
  const detailDefault = isCoarse() ? 'phone' : 'normal';
  let detail = detailDefault;
  try { detail = localStorage.getItem('berlinDrive.detail') || detailDefault; } catch { /* no storage */ }
  if (!DETAIL[detail]) detail = detailDefault;
  const urlBudget = params.get('tilebudget');
  stream = await createStreamer({ scene, camera, renderer, mood, url: base + level.stream.file, tiles: site.tiles,
                                  budgetMB: +(urlBudget || DETAIL[detail][0]),
                                  tau: DETAIL[detail][1], aniso: DETAIL[detail][2] }).catch((e) => { fail(e); throw e; });
  const sel = document.createElement('select');
  sel.className = 'button'; sel.id = 'detailSel';

  get camFrameFix() { return camFrameFix; }, get camKeepFrame() { return camKeepFrame; }, set camKeepFrame(v) { camKeepFrame = !!v; }, carNdcMax, cam, setCam,   // car-in-frame rule; cam.headUp, setCam('height', 30)
  // run physics synchronously (frame-rate independent), e.g. simulate(3, ['ArrowUp'])
  simulate(seconds, held = []) { const k = new Set(held); for (let i = 0; i < seconds / STEP; i++) stepOnce(k); renderFrame(); return this.state(); },
  // n physics steps without rendering, each(i) after every step (camera invariants), e.g. steps(60, ['ArrowUp'], () => carNdcMax())
  steps(n, held = [], each = null) { const k = new Set(held); for (let i = 0; i < n; i++) { stepOnce(k); each?.(i); } },
  teleport(x, z, h) { endSinking(); endJump(); sbahn?.setActive(false); tunnels?.setActive(false); roofs?.setActive(false); vehicle.reset(x, z, h); camReset(); carGround.reset(); safe.length = 0; },
  render() { renderFrame(); },
  showDebug(v = true) { wallViz.visible = v; pitViz.visible = v; walls?.setDebug(v); clutter?.setDebug(v); },
  get walls() { return walls; },
  get clutter() { return clutter; },   // streamed trunks + obstacles (js/clutter.js): inside(x, z), stats(); null without clutter.json   // streamed building walls (js/walls.js): inside(x, z), hits(...), stats(); null without walls.json
  // obstacle switch: setCollision(false) = trunks + mesh obstacles off, buildings stay (saved as berlinDrive.collision); stream: tile streamer or null
  setCollision, get collision() { return collision; }, stream, get minimap() { return minimap || minimapStub; },
  get intro() { return loading; },   // loading screen (js/loading.js; was the start screen): open, named, progress; hide() / show() do nothing
  resetSettings,   // every setting to its default (progress kept), reload at the same spot
  newGame,   // Neustart without the menu's question: progress (bears, balloon cut, saved position) cleared, reload
  get gamepad() { return gamepad; },   // js/gamepad.js: connected, id, state(), inject(getPads) for tests, poll(now)
  get loading() { return loading; }, get menu() { return menu; }, get paused() { return pauseBy.size > 0; }, get mapDrive() { return !!mapDrive; },   // Esc menu (js/menu.js): open(page), close()
  get eggs() { return eggs; },   // football + bear hunt (js/eggs.js): items(), found(), reset(), ball, goals, placeBall(x, z, vx, vz)
  get skid() { return skid; },   // skid marks (js/skid.js): opts (live), setEnabled(bool) (saved as berlinDrive.skid), clear(), enabled, laid
  get dust() { return dust; },   // street dust (js/dust.js): puff(kind?, k?), setEnabled(bool) (saved as berlinDrive.dust), enabled, alive, rough, opts
  get areaSign() { return areaSign; },   // street-name plate (js/areasign.js): show(name), opts (live tuning), state() (candidate, why, last decision)
  get borderShimmer() { return borderShimmer; },   // border shimmer (js/bordershimmer.js): pulse(), setEnabled(bool) (saved as berlinDrive.shimmer), enabled, opts
  get doves() { return doves; },   // white doves (js/doves.js): release(n?), setEnabled(bool) (saved as berlinDrive.doves), enabled, active, next, opts
  // top speed km/h (0 = free), as the Speed dropdown: berlinDrive.speedLimit = 30 (saved)
  get speedLimit() { return speedLimitKmh; }, set speedLimit(v) { setSpeedLimit(v); },
  // bouncy hop (Space); false while sinking or already in the air. jumpState: { y, vy, air, escapes } or null
  jump: () => doJump(), get jumpState() { return jump && { ...jump }; },
  // map edge (js/edge.js): turnAround() = U; edge = { dist, gap, side, toward, opacity, hint, pulse, pushT, restT, turning, trail }
  turnAround: () => edge.turnAround(), get edge() { return { ...edge.info }; }, edgeModule: edge,
  balloon,   // Weltballon (js/balloon.js): position, height, phase, setPhase(s), items(), startRide(), riding; cutNow(), restore(), state
  // no-drive zones (js/nodrive.js): zones [{ name, poly: [[x, z]...], box, cx, cz }], inside(x, z), hit(x, z, heading)
  noDrive,
  respectLine,   // "Respect is Everything." (js/respect.js): show() to try it, opts
  // Stadtbahn (js/sbahn.js): sbahn.active (rails mode), enter(s | station name), exit(name?), route [[x, z]...], items()
  get sbahn() { return sbahn; },
  // road tunnels (js/tunnels.js): active (tunnel mode), guided, items() (portals), routes, enter(portal id | index), portals(), stats()
  get tunnels() { return tunnels; },
  // roof mode (js/roofs.js): active, enter(route | spot slug) = onto the roof now, exit() = down to the street, deckAt(x, z), checkpoints, items(), stats()
  get roofs() { return roofs; },
  bridges,   // bridges over water (js/bridges.js): items(), deckAt(x, z), ground(x, z, y), stats(); null without bridges.json
  // easter-egg links (levels/<name>/spots.json): [{ slug, name, kind, url }]; spot(slug) = drive there now
  spots: () => spots.map((p) => ({ slug: p.slug, name: p.name, kind: p.kind, url: spotUrl(p.slug) })),
  spot(slug) { const q = spots.find((p) => p.slug === slug); if (!q) { console.warn('unknown spot', slug); return false; } if (q.roof) return roofs.enter(q.roof, { x: q.start.x, z: q.start.z, h: q.start.heading }); this.teleport(q.start.x, q.start.z, q.start.heading); return true; },
  state() { const p = vehicle.getPosition(), ll = geoFrame.toLatLon(p.x, p.y); return { x: p.x, z: p.y, lat: ll.lat, lon: ll.lon, kmh: vehicle.speedKmh, sinking: !!sinking, sinkKind: sinking?.kind ?? null, rescueT: sinking ? sinking.t : null, carY: carRoot.position.y, pit: isPit(p.x, p.y), rescuer: rescuer.visible, water: isWater(p.x, p.y), shadow: shadow.visible, tunnel: !!tunnels?.active, meshLoaded, collision, stream: stream?.stats() }; },
};
// ?spot= on a roof (spots.json `roof`): onto the deck in roof mode (needs berlinDrive.teleport above)
if (SPOT?.roof && !(resume && resume.level === LEVEL)) roofs.enter(SPOT.roof, SPOT);   // the spot's start pose on that deck

// ---------- position broadcast ~4x/s + teleport from map.html (the owner's tool page; no longer linked from the game) ----------
{
  const bc = typeof BroadcastChannel === 'function' ? new BroadcastChannel('berlinDrive') : null;
  // a map target inside a building / water / pit goes to the nearest clear spot (findFree, 40 m)
  const clear = (x, z, h) => (isWater(x, z) || isPit(x, z) || !spotClear(x, z, h) ? findFree(x, z, h) : { x, z });
  if (AT) {
    const f = SPOT ? AT : clear(AT.x, AT.z, AT.h);   // ?spot= wins over ?at=
    if (f.x !== AT.x || f.z !== AT.z) { vehicle.reset(f.x, f.z, AT.h); camReset(); }
    const u = new URL(location.href); u.searchParams.delete('at'); history.replaceState(null, '', u.href);   // reload = normal spawn
  }
  const post = () => {
    if (leaving) return;   // newGame(): nothing re-saves a position during its reload
    const p = vehicle.getPosition(), ll = geoFrame.toLatLon(p.x, p.y);
    const m = { type: 'pos', level: LEVEL, x: p.x, z: p.y, heading: vehicle.getHeading(), speed: vehicle.speedKmh, lat: ll.lat, lon: ll.lon, t: Date.now() };
    if (bc) bc.postMessage(m); else try { localStorage.setItem('berlinDrive.pos', JSON.stringify(m)); } catch { /* no storage */ }
  };
  const onCmd = (m) => {
    if (!m || m.level == null) return;
    if (m.type === 'teleport' && m.level === LEVEL) {
      const f = clear(m.x, m.z, m.heading); window.berlinDrive.teleport(f.x, f.z, m.heading); post();
    }
  };
  if (bc) bc.onmessage = (e) => onCmd(e.data);
  addEventListener('storage', (e) => { if (e.key === 'berlinDrive.cmd') try { onCmd(JSON.parse(e.newValue)); } catch { /* bad json */ } });
  setInterval(post, 250);
}

// ---------- Neustart: a real fresh start (berlinDrive.newGame(); the menu asks first) ----------
// Progress keys are cleared, settings kept, then the page reloads without ?spot= / ?at= (the
// mood stays in the URL: a setting). On the reload everything in memory starts fresh too:
// balloon start rule and cycle, football score, street-plate history, skid marks, roof /
// S-Bahn / tunnel modes. Nothing writes a position on the way out (`leaving`).
// Progress (reset): localStorage berlinDrive.eggs.found, berlinDrive.balloon.cut, berlinDrive.pos;
// sessionStorage berlinDrive.resume. Everything else under berlinDrive.* is a setting (kept).
const PROGRESS_KEYS = ['berlinDrive.eggs.found', 'berlinDrive.balloon.cut', 'berlinDrive.pos'];
let leaving = false;
function newGame() {
  leaving = true;
  for (const k of PROGRESS_KEYS) try { localStorage.removeItem(k); } catch { /* no storage */ }
  try { sessionStorage.removeItem('berlinDrive.resume'); } catch { /* no storage */ }
  const u = new URL(location.href);
  for (const k of ['spot', 'at', 'level']) u.searchParams.delete(k);
  location.replace(u.href);
  return true;
}
// ---------- Auf Standard zurücksetzen (Einstellungen; berlinDrive.resetSettings()) ----------
// The opposite of newGame(): every SETTING back to its default, PROGRESS untouched. Done by
// removing the setting keys and reloading through the mood-switch path (sessionStorage
// berlinDrive.resume keeps the car where it is, as the default car), with ?mood= and the
// setting overrides ?maxspeed= ?height= ?distance= ?camcollide= ?skycam= dropped. So every default comes
// from the code that applies it when no key is stored (no second copy here). After the reload
// the menu reopens on Einstellungen (sessionStorage berlinDrive.reopen).
function resetSettings() {
  leaving = true;
  const keep = new Set([...PROGRESS_KEYS, 'berlinDrive.cmd']);
  try {
    const ks = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('berlinDrive.') && !keep.has(k)) ks.push(k); }
    for (const k of ks) localStorage.removeItem(k);
  } catch { /* no storage: nothing saved anyway */ }
  const p = vehicle.getPosition(), u = new URL(location.href);
  for (const k of ['mood', 'maxspeed', 'height', 'distance', 'camcollide', 'skycam']) u.searchParams.delete(k);
  try {
    sessionStorage.setItem('berlinDrive.resume', JSON.stringify(
      { level: LEVEL, kind: 'car', x: p.x, z: p.y, h: vehicle.getHeading(), sbahn: !!sbahn?.active, tunnel: !!tunnels?.active, roof: !!roofs?.active }));
    sessionStorage.setItem('berlinDrive.reopen', 'settings');
  } catch { /* no storage */ }
  location.replace(u.href);
  return true;
}
// ---------- Esc menu (js/menu.js): Weiter, Karte, Einstellungen, Steuerung, Info, Neustart + the bear count ----------
// Settings rows call the old controls' functions (same storage keys; Obstacles still start off on every load).
{
  const MOOD_TXT = { '': 'Aus', day: 'Tag', moon: 'Mond', snow: 'Schnee' };
  const PAINT_TXT = { red: 'Rot', blue: 'Blau', yellow: 'Gelb', green: 'Grün', orange: 'Orange', purple: 'Lila' };
  const DETAIL_TXT = { phone: 'Handy', low: 'Niedrig', normal: 'Normal', high: 'Hoch' };
  const redraw = () => { pausedRedraw = true; };   // the frozen picture shows a new paint / vehicle at once
  const settings = () => {
    const speeds = [...new Set([...SPEED_CHOICES, speedLimitKmh])];   // e.g. ?maxspeed=40 adds its value
    const rows = [
      { label: 'Stimmung', choices: MOODS.map((m) => [m, MOOD_TXT[m] ?? m]), get: () => moodNow, set: (v) => setMood(v),
        note: 'Ein Wechsel lädt die Seite neu; das Auto bleibt, wo es ist.' },
      { label: 'Fahrzeug', choices: VEHICLE_CHOICES.map((c) => [c, c === 'bus' ? 'Bus' : PAINT_TXT[c.slice(4)] || c.slice(4)]),
        get: () => (vehicle.specName === 'bus' ? 'bus' : 'car:' + carPaint), set: (v) => { setVehicle(v); redraw(); } },
      { label: 'Blinker', choices: [[true, 'An'], [false, 'Aus']],   // berlinDrive.setBlinkers / .blinkers (car visuals; saved as berlinDrive.blinkers, default on)
        get: () => window.berlinDrive?.blinkers ?? true, set: (v) => { window.berlinDrive?.setBlinkers?.(v); redraw(); } },
      { label: 'Tempo (km/h)', choices: speeds.map((v) => [v, v ? String(v) : 'frei']), get: () => speedLimitKmh, set: (v) => setSpeedLimit(v) },
      { label: 'Hindernisse', choices: [[false, 'Aus'], [true, 'An']], get: () => collision, set: (v) => setCollision(v),
        disabled: !hasColliders, note: hasColliders ? 'Bäume und Straßenhindernisse; Häuser bremsen immer.' : 'Auf diesem Level gibt es keine Straßenhindernisse.' },
    ];
    if (setDetail) rows.push({ label: 'Detail', choices: detailChoices.map((k) => [k, DETAIL_TXT[k] || k]), get: detailNow, set: (v) => setDetail(v),
                               note: 'Niedrig für ältere oder integrierte Grafikchips.' });
    rows.push({ label: 'Ansicht', choices: [['standard', 'Standard'], ['horizon', 'Horizont']], get: () => view, set: (v) => { setView(v); redraw(); },
                note: 'Horizont: tiefe Kamera mit Himmel und Skyline. Höhe und Abstand merkt sich jede Ansicht für sich.' });   // berlinDrive.setView / .view (saved as berlinDrive.view)
    rows.push({ label: 'Kamera', node: $('camui'), home: $('toprow') });
    rows.push({ action: 'Auf Standard zurücksetzen', run: resetSettings });   // quiet text button at the bottom
    return rows;
  };
  menu = createMenu({
    base,
    bears: () => (eggs && eggs.count ? { count: eggs.count } : null),   // only "7 / 18" (owner): no list, names or hints in the menu
    openMap: () => (minimap ? minimap.setOverview(true) : menu.mapClosed()),
    restart: () => restart(),   // "Zum Start" (= key R): the car back at the start, progress kept
    newGame: () => newGame(),   // "Neustart": all progress back to zero (confirmed in the menu)
    settings,
    onPause: (on) => setPause('menu', on),
    slowMo,   // Esc: slow motion into the pause, short ease out (MENU_FX in js/menu.js)
    isBlocked: () => loading.open,
    isOverview: () => !!minimap?.overview,
  });
}
</script>
